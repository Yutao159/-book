<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 书籍推荐系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-5">👤 用户注册</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">用户ID（自定义数字）</label>
                        <input type="number" class="form-control" id="regUserId" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">所在城市</label>
                        <input type="text" class="form-control" id="regCity" placeholder="比如：北京" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">年龄</label>
                        <input type="number" class="form-control" id="regAge" min="5" max="100" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">注册</button>
                </form>
                <div class="text-center mt-3">
                    <a href="/">返回推荐页面</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('regUserId').value;
            const city = document.getElementById('regCity').value;
            const age = document.getElementById('regAge').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, city: city, age: age})
                });
                const data = await response.json();
                if (data.code === 200) {
                    alert('注册成功！返回推荐页面输入你的ID即可');
                    window.location.href = '/';
                } else {
                    alert('注册失败：' + data.message);
                }
            } catch (e) {
                alert('注册失败：' + e.message);
            }
        });
    </script>
</body>
</html>
